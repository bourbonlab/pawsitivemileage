name: Deploy environment

# Reusable: deploys one environment with ./deploy.sh, using the deploy role and config of the
# GitHub environment of the same name. Called by deploy.yml.

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string
      version:
        description: Release tag (vX.Y.Z) shown in the app footer
        required: true
        type: string

permissions:
  contents: read

env:
  NPM_VERSION: 12.0.2

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.FRONTEND_DOMAIN }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS deploy role
    env:
      TARGET_ENV: ${{ inputs.environment }}
      APP_VERSION: ${{ inputs.version }}
      # Same names deploy.sh reads from .env; per-environment values are unsuffixed here.
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET_ARN: ${{ vars.GOOGLE_CLIENT_SECRET_ARN }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
      SOURCE_CODE_URL: ${{ vars.SOURCE_CODE_URL }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check target
        run: |
          case "$TARGET_ENV" in
            staging|production) ;;
            *) echo "::error::Unknown environment: $TARGET_ENV"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install --global "npm@${NPM_VERSION}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      # Tests already ran in the CI stage of this workflow run.
      - name: deploy.sh
        run: |
          if [[ "$TARGET_ENV" == production ]]; then
            ./deploy.sh --prod --yes --skip-tests
          else
            ./deploy.sh --stage --skip-tests
          fi
