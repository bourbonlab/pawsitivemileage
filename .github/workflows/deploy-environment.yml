name: Deploy environment

# Reusable: deploys one environment with ./deploy.sh, using the deploy role and config of the
# GitHub environment of the same name. Called by deploy.yml.

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string
      version:
        description: Release tag (vX.Y.Z) shown in the app footer
        required: true
        type: string

permissions:
  contents: read

env:
  NPM_VERSION: 12.0.2

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.FRONTEND_DOMAIN }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS deploy role
    env:
      TARGET_ENV: ${{ inputs.environment }}
      APP_VERSION: ${{ inputs.version }}
      # Same names deploy.sh reads from .env; per-environment values are unsuffixed here.
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET_ARN: ${{ vars.GOOGLE_CLIENT_SECRET_ARN }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
      SOURCE_CODE_URL: ${{ vars.SOURCE_CODE_URL }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check target
        run: |
          case "$TARGET_ENV" in
            staging|production) ;;
            *) echo "::error::Unknown environment: $TARGET_ENV"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install --global "npm@${NPM_VERSION}"

      # Until the app is on Google Play, production offers the signed APK for download
      # (web footer, /downloads/). Built before deploy.sh so the web build includes it.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: inputs.environment == 'production'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: inputs.environment == 'production'

      - name: Build the Android APK
        if: inputs.environment == 'production'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::warning::No Android signing key in this environment; the published APK stays as it is"
            exit 0
          fi
          if [[ ! "$APP_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::'$APP_VERSION' is not a release version; the published APK stays as it is"
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > android/keystore.properties
          (cd android && ./gradlew :app:assembleProductionRelease -PappVersion="$APP_VERSION" --console=plain)
          rm -f "$keystore" android/keystore.properties
          apk="android/app/build/outputs/apk/production/release/app-production-release.apk"
          name="PawsitiveMileage-${APP_VERSION}.apk"
          mkdir -p web/public/downloads
          cp "$apk" "web/public/downloads/$name"
          printf '{"version":"%s","url":"/downloads/%s","bytes":%s,"sha256":"%s"}\n' \
            "$APP_VERSION" "$name" "$(stat -c %s "$apk")" "$(sha256sum "$apk" | cut -d' ' -f1)" > web/public/downloads/android.json
          cat web/public/downloads/android.json

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      # Tests already ran in the CI stage of this workflow run.
      - name: deploy.sh
        run: |
          if [[ "$TARGET_ENV" == production ]]; then
            ./deploy.sh --prod --yes --skip-tests
          else
            ./deploy.sh --stage --skip-tests
          fi
